<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cake Tower</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍰</text></svg>">
<link rel="stylesheet" href="assets/fonts/fredoka.css">
<style>
  :root { --ink: #7a4a2e; --cream: #fff8ee; --pink: #ff9db4; }
  html { font-size: clamp(12px, min(3.2vw, 3.2vh), 22px); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fbe9df; touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  #game { position: fixed; inset: 0; }
  #photoback { position: fixed; inset: 0; pointer-events: none;   /* the shop's wallpaper, softer, around the game-over photo */
    background: repeating-linear-gradient(90deg, #f8d9d3 0 2.1rem, #fdf2e8 2.1rem 4.2rem); }
  #photoframe { position: fixed; pointer-events: none; box-sizing: content-box; border: .55rem solid #fff8ee; border-radius: 1rem;
    transform: translate(-.55rem, -.55rem); box-shadow: 0 0 0 .14rem var(--ink), 0 .5rem 1.1rem rgba(122, 74, 46, .3); }
  #photoframe::before { content: ""; position: absolute; left: 50%; top: -1.35rem; width: 5.4rem; height: 1.6rem; border-radius: .2rem;
    transform: translateX(-50%) rotate(-3deg); background: rgba(255, 157, 180, .82)
    repeating-linear-gradient(45deg, rgba(255, 255, 255, .32) 0 .35rem, transparent .35rem .7rem); }
  #hud { position: fixed; inset: 0; pointer-events: none; font-family: "Fredoka", sans-serif; color: var(--ink); }
  .stroke { color: #fff; paint-order: stroke fill; -webkit-text-stroke: var(--sw) var(--ink); }

  #best { position: absolute; left: 1rem; top: calc(1rem + env(safe-area-inset-top)); display: flex; align-items: center; gap: .45rem;
    padding: .35rem .95rem .35rem .75rem; background: var(--cream); border: .18rem solid var(--ink); border-radius: 999px; font-size: 1.05rem; font-weight: 600; }
  #best svg { width: 1.35rem; fill: #ffd75e; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
  #score { position: absolute; left: 0; right: 0; top: calc(.1rem + env(safe-area-inset-top)); text-align: center; font-size: 3.8rem; font-weight: 700; --sw: .55rem; }
  #controls { position: absolute; right: 1rem; top: calc(1rem + env(safe-area-inset-top)); display: flex; gap: .5rem; }
  .round { position: relative; width: 2.6rem; height: 2.6rem; padding: 0; pointer-events: auto; cursor: pointer;
    background: var(--cream); border: .18rem solid var(--ink); border-radius: 50%; }
  .round svg { position: absolute; left: 20%; top: 20%; width: 60%; height: 60%; fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .round svg .fill { fill: var(--ink); stroke: none; }
  .round.off svg { opacity: .35; }
  .round.off::after { content: ""; position: absolute; left: 16%; right: 16%; top: calc(50% - .09rem); height: .18rem; border-radius: .1rem; background: var(--ink); transform: rotate(-45deg); }
  #pause i { position: absolute; top: 28%; width: 16%; height: 44%; border-radius: .15rem; background: var(--ink); }
  #pause i:first-child { left: 29%; } #pause i:last-child { left: 55%; }

  .card { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); min-width: 12rem; padding: 1.2rem 1.9rem 1.3rem; text-align: center;
    background: rgba(255, 248, 238, .94); border: .2rem solid var(--ink); border-radius: 1.4rem; box-shadow: 0 .35rem 0 rgba(122, 74, 46, .22); }
  @media (orientation: landscape) { .card { top: 5%; } }
  .card h1 { margin: 0 0 .35rem; font-size: 3.3rem; line-height: .95; font-weight: 700; color: var(--pink); --sw: .5rem; }
  .card h2 { margin: 0 0 .3rem; font-size: 2.4rem; font-weight: 700; color: var(--pink); --sw: .4rem; }
  .card p { margin: .2rem 0; font-size: 1.05rem; font-weight: 600; }
  .card .big { font-size: 1.5rem; }
  .cta { display: inline-block; margin-top: .75rem; padding: .4rem 1.2rem; background: var(--pink); border: .18rem solid var(--ink); border-radius: 999px;
    font-size: 1.15rem; font-weight: 700; --sw: .28rem; animation: bob 1.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-.25rem); } }

  #over { top: calc(4.2rem + env(safe-area-inset-top)); }
  @media (orientation: landscape) { #over { left: auto; right: 4%; top: 50%; transform: translateY(-50%); } }
  .chip { display: block; margin: .7rem auto 0; padding: .4rem 1.1rem; font: 600 1.05rem "Fredoka", sans-serif; color: var(--ink);
    background: #fff; border: .16rem solid var(--ink); border-radius: 999px; pointer-events: auto; cursor: pointer; }
  .chip:disabled { opacity: .7; cursor: default; }

  .banner { position: absolute; left: 50%; top: 26%; transform: translate(-50%, -50%); white-space: nowrap; text-align: center;
    font-size: 3.1rem; font-weight: 700; line-height: 1; color: var(--pink); --sw: .55rem; animation: banner 2.4s ease-out forwards; }
  .banner small { display: block; margin-bottom: .2rem; font-size: .42em; color: #fff; }
  @keyframes banner { 0% { opacity: 0; scale: .4; } 12% { opacity: 1; scale: 1.12; } 20% { scale: 1; } 80% { opacity: 1; margin-top: 0; } 100% { opacity: 0; margin-top: -1.5rem; } }
  .pop { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; font-size: 1.7rem; font-weight: 700; --sw: .38rem; animation: pop .9s ease-out forwards; }
  @keyframes pop { 0% { opacity: 0; margin-top: .6rem; scale: .6; } 20% { opacity: 1; scale: 1.08; } 100% { opacity: 0; margin-top: -2.4rem; scale: 1; } }
</style>
</head>
<body>
<div id="game"></div>
<div id="photoback" hidden></div>
<div id="photoframe" hidden></div>
<div id="hud">
  <div id="best"><svg viewBox="0 0 24 20"><path d="M3 18 L1 4 L8 9 L12 1 L16 9 L23 4 L21 18 Z"/></svg><span>BEST <b id="best-n">0</b></span></div>
  <div id="score" class="stroke" hidden>0</div>
  <div id="controls">
    <button id="music" class="round" aria-label="Music"><svg viewBox="0 0 24 24"><path d="M9 17V5l10-2v12"/><ellipse class="fill" cx="6.5" cy="17.5" rx="3" ry="2.5"/><ellipse class="fill" cx="16.5" cy="15.5" rx="3" ry="2.5"/></svg></button>
    <button id="sound" class="round" aria-label="Sound"><svg viewBox="0 0 24 24"><path class="fill" d="M3 9h4l5-4v14l-5-4H3z"/><path d="M16 8.5a5 5 0 0 1 0 7M19 5.5a9 9 0 0 1 0 13"/></svg></button>
    <button id="pause" class="round" aria-label="Pause" hidden><i></i><i></i></button>
  </div>
  <section id="title" class="card">
    <h1 class="stroke">Cake<br>Tower</h1>
    <p>Stack the cakes as high as you can!</p>
    <div class="cta stroke">Tap to start</div>
  </section>
  <section id="over" class="card" hidden>
    <h2 class="stroke">Oops!</h2>
    <p class="big"><b id="over-n">0 cakes</b> tall</p>
    <p id="over-best">Best 0</p>
    <button id="photo" class="chip" type="button">Save photo</button>
    <div class="cta stroke">Tap to play again</div>
  </section>
  <section id="paused" class="card" hidden>
    <h2 class="stroke">Paused</h2>
    <div class="cta stroke">Tap to continue</div>
  </section>
</div>
<script src="lib/phaser.min.js"></script>
<script src="src/audio.js"></script>
<script src="src/game.js"></script>
</body>
</html>
